courses:
- title: 命題邏輯
  id: pl
  intro: 命題邏輯是最基礎的形式邏輯系統，以「命題」──可判定真假的敘述──為最基礎的建構單元，透過 AND、OR、NOT、IMPLIES 等連接詞組合出複雜公式。它提供了真值表與演繹規則，讓我們能以機械化方式判斷公式的有效性，並為證明、程式驗證與自動定理證明奠定核心工具。透過學習命題邏輯，學生將掌握形式化推理的語法與語義，為後續的述詞邏輯、型別理論與 SMT 技術建立扎實基礎。
  instructors:
  - name: 王柏堯
    personalPage: "https://homepage.iis.sinica.edu.tw/~bywang/"
    affi: 中央研究院資訊科學所
  - name: 黃鐘揚
    personalPage: "https://cc.ee.ntu.edu.tw/~ric/"
    affi: 台灣大學電機系暨電子研究所
  resource:
  - type: 投影片
    items:
    - name: PL 1
      link: "/2025/pl.pdf"
- title: 布林可滿足性問題與二元決策圖
  id: satbdd
  intro: SAT（布林可滿足性問題）與二元決策圖（Binary Decision Diagram, BDD）是現代邏輯優化與自動化推理的兩大支柱。SAT 透過高效求解器判定布林公式是否存在滿足解，已成為硬體驗證、形式化檢查與組合最佳化的核心工具；BDD 則以圖形化結構將布林函式壓縮為共享決策樹，使得等價判定與函式操作在圖上即可快速進行。本課程將介紹 SAT 演算法（DPLL、CDCL）、BDD 建構與簡約技巧，並展示二者在電路設計、軟體分析及 AI 規劃中的互補應用，讓學員習得在實務系統中選擇與整合這兩種技術的關鍵思維。
  instructors:
  - name: 王柏堯
    personalPage: "https://homepage.iis.sinica.edu.tw/~bywang/"
    affi: 中央研究院資訊科學所
  - name: 黃鐘揚
    personalPage: "https://cc.ee.ntu.edu.tw/~ric/"
    affi: 台灣大學電機系暨電子研究所
  resource:
  - type: 投影片
    items:
    - name: BDD 1
      link: "/2025/satbdd_1.pdf"
    - name: BDD 2
      link: "/2025/satbdd_2.pdf"
    - name: BDD 3
      link: "/2025/satbdd_3.pdf"
- title: 硬體模型檢測
  id: hmc
  intro: 硬體模型檢查（Hardware Model Checking）是一種自動化形式化驗證技術，透過在狀態空間中系統性地探索電路模型，確保晶片設計滿足時間邏輯（如 LTL／CTL）所描述的安全與活性性質。課程將聚焦於符號式模型檢查（BDD 與 SAT/SMT-based）、邊界模型檢查（BMC）、及形式財產驗證（FPV）的實務流程，並示範如何將 Verilog/VHDL 轉換為過渡系統、撰寫屬性、解析失敗範例（counter-example），以及運用工業級工具在 SoC 及 FPGA 專案中提早捕捉設計缺陷，縮短迴圈、提升可靠度。
  instructors:
  - name: 王柏堯
    personalPage: "https://homepage.iis.sinica.edu.tw/~bywang/"
    affi: 中央研究院資訊科學所
  - name: 黃鐘揚
    personalPage: "https://cc.ee.ntu.edu.tw/~ric/"
    affi: 台灣大學電機系暨電子研究所
  resource:
  - type: 投影片
    items:
    - name: HMC
      link: "/2025/hmc.pdf"
- title: 一階邏輯
  id: fol
  intro: 一階邏輯（First-order Logic, FOL）在命題邏輯的基礎上加入「變數、量詞與謂詞」，能精確表達「所有…皆…」與「存在…使…」等結構化敘述，是數學證明、程式規格與自動定理證明的核心語言。本課程將介紹 FOL 的語法與語意、自由與束縛變數、模型與滿足關係，以及完備性與可靠性等基本定理；進一步探討一階合取標準形、分辨率（resolution）演算法及其在 SMT 解題、軟體驗證和資料庫查詢中的應用，讓學員奠定形式化推理與邏輯推導的堅實基礎。
  instructors:
  - name: 陳郁方
    personalPage: "https://guluchen.github.io/"
    affi: 中央研究院資訊科學所
  - name: 蔡明憲
    personalPage: "https://www.cs.ntust.edu.tw/p/406-1102-121077,r2079.php?Lang=zh-tw"
    affi: 台灣科技大學資訊管理系
  resource:
  - type: 投影片
    items:
    - name: FOL 1
      link: "/2025/fol.pdf"
    - name: PV
      link: "/2025/pv.pptx"
    - name: SLIDES
      link: "/2025/Flolac_slides.zip"
- title: 模組理論可滿足性
  id: smt
  intro: SMT（Satisfiability Modulo Theories，模組理論可滿足性）將 SAT 的布林求解核心與多種理論（如整數/實數算術、位向量、陣列、字串、遞歸資料結構等）結合，能直接處理帶有數學運算與資料結構的約束。現代 SMT 求解器採用 DPLL(T) 框架，協調 SAT 引擎與專用理論決策程序，已成為軟體/硬體驗證、符號執行、自動合成與優化領域的關鍵基礎。本課程將介紹 SMT-LIB 語法、DPLL(T) 演算法、主流理論決策器的原理，並透過實例展示如何在程式分析、模型檢查與約束優化中高效運用 SMT 技術。
  instructors:
  - name: 陳郁方
    personalPage: "https://guluchen.github.io/"
    affi: 中央研究院資訊科學所
  - name: 蔡明憲
    personalPage: "https://www.cs.ntust.edu.tw/p/406-1102-121077,r2079.php?Lang=zh-tw"
    affi: 台灣科技大學資訊管理系
  resource:
  - type: 投影片
    items:
    - name: SMT 1
      link: "/2025/smt_1.pdf"
    - name: SMT 2
      link: "/2025/smt_2.pdf"
    - name: SMT 3
      link: "/2025/smt_3.pdf"
    - name: SMT 4
      link: "/2025/smt_4.pdf"
  - type: 範例
    items:
    - name: Z3
      link: "/2025/z3py.zip"
- title: 自動機理論
  id: at
  intro: 自動機理論是理論計算機科學的基石，研究有限狀態機、推疊自動機、圖靈機等抽象運算模型，以及它們所辨識的形式語言階層（正則語言、上下文無關語言等）。藉由描述狀態轉移與接受條件，自動機為編譯器、正則表示式引擎、模型檢查乃至自然語言處理提供精確的規格與分析工具。本課程將介紹正則運算、DFA/NFA 等價轉換、PDA 與 CFG 的對應、決定性與不可決定性、語言封閉性與可判定性等核心概念，並透過實作展示自動機在程式語言分析與模式比對中的實務應用。
  instructors:
  - name: 林濬璈
    personalPage: "https://carquois42.github.io/"
    affi: 台北科技大學資訊工程學系暨創新前瞻科技研究學院
  resource:
  - type: 投影片
    items:
    - name: AT
      link: "/2025/at_v3.pdf"
- title: 軟體模型檢測
  id: smc
  intro: 軟體模型檢查（Software Model Checking）以自動化技術在程式的狀態空間中探索，驗證其是否滿足安全與活性等規格。相較於傳統測試，它能覆蓋所有可達路徑並於發現錯誤時給出具體反例。課程將介紹抽象解釋與 CEGAR（Counter-Example Guided Abstraction Refinement）、符號與路徑取樣方法（如 Bounded Model Checking、符號執行）、以及現代工具（BLAST、CPAchecker、SPIN、KLEE）的核心演算法與實務工作流程。透過案例研究，學員將學會如何把 C/C++、Java、Rust 程式轉換成可驗證模型、撰寫屬性、分析反例，並將模型檢查整合進 CI/CD 以在開發早期捕捉潛在缺陷。
  instructors:
  - name: 李念澤
    personalPage: "https://nianzelee.github.io/"
    affi: 台灣大學電機工程學系
  resource:
  - type: 投影片
    items:
    - name: SMC
      link: "/2025/smc.pdf"
- title: 自動機學習與參數化驗証
  id: alpv
  intro: 本課程聚焦於 自動機學習（Automata Learning），特別是 Angluin 經典的 L* 主動學習演算法，並介紹其在 參數化驗證 中的創新應用。L* 透過「查詢–反例」迴圈自動推導最小 DFA，為未知或黑箱系統建構可機械分析的模型。當系統包含任意數量的相同元件時，我們結合學到的自動機與抽象加強技術，形成一般化不變式並保證性質對所有規模都成立。
  instructors:
  - name: 洪智鐸
    personalPage: "https://chihduo.github.io/"
    affi: 政治大學資訊管理學系
  resource:
  - type: 投影片
    items:
    - name: ALPV
      link: "/2025/alpv.pdf"
- title: 自動機與軟體安全
  id: afss
  intro: 本課程將介紹如何運用 「有限／符號自動機」來建模程式中的字串與輸入資料流，並自動偵測與修補常見漏洞（如 XSS、SQL 注入）。內容源自郁方教授在自動機式字串分析工具 STRANGER 與「前向／回溯符號分析產生漏洞簽章」等研究成果，說明自動機模型如何結合 SMT 求解器與查詢-反例迴圈，精準判定安全屬性並生成防護簽章。
  instructors:
  - name: 郁方
    personalPage: "https://mis2.nccu.edu.tw/zh_tw/Faculty/Faculty_01/%E9%83%81%E6%96%B9-33653605"
    affi: 政治大學資訊管理學系
  resource:
  - type: 投影片
    items:
    - name: AFSS
      link: "/2025/afss.pdf"
- title: 量化可滿足性及其在驗證與合成的應用
  id: qsasv
  intro: 量化可滿足性（Quantified Satisfiability，QBF）在布林 SAT 上加入全稱與存在量詞，可自然編碼控制器合成、時序邏輯驗證等 PSPACE 完備問題。現代 QBF 求解器支援 Skolem／Herbrand 函式擷取，使「公式為真」時立即產生實作策略，「公式為假」則提供可解析的反例。課程將介紹 prenex-CNF 編碼、DPLL(Q) 與 expansion 求解，以及 QBF 證書在合成與錯誤診斷中的實務應用。
  instructors:
  - name: 江介宏
    personalPage: "https://www.ee.ntu.edu.tw/profile1.php?teacher_id=943014"
    affi: 台灣大學電機工程學系暨電子工程研究所
  resource:
  - type: 投影片
    items:
    - name: QSASV
      link: "/2025/qsasv.pdf"
- title: The Role of Logic and Automata in Understanding Transformers
  id: special
  intro: The advent of transformers has in recent years led to powerful and revolutionary Large Language Models (LLMs). Despite this, our understanding on the capability of transformers is still meager. In this invited contribution, we recount the rapid progress in the last few years to the question of what transformers can do. In particular, we will see the integral role of logic and automata (also with some help from circuit complexity) in answering this question. We also mention several open problems at the intersection of logic, automata, verification and transformers.
  instructors:
  - name: Anthony Widjaja Lin
    personalPage: "https://anthonywlin.github.io/"
    affi: Theoretical Computer Science (Automated Reasoning) and Max-Planck Fellow at University of Kaiserslautern, Germany
  resource:
  - type: 論文
    items:
    - name: Paper
      link: "/2025/lecture.pdf"

