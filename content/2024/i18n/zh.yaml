location: "地點：國立臺灣大學管理學院一號館103教室"
introduction-text: 本課程將講授程式語言領域之入門理論與知識，希望培養學生以型式邏輯進行清晰思考的能力，了解邏輯與程式語言、型別系統的密切關係，以及型別系統在程式語言中扮演的角色，使學生能以遞迴／迭構方式理解並解決程式設計問題，能運用軟體工具輔助邏輯推理及證明程式正確性，並具備進一步探索程式語言相關領域的知識基礎。

special-lecture: 特別講座
special-topic: "Programming with Modal Types"
special-topic-intro: >-
  FLOLAC 2024 很榮幸邀請到劍橋大學 <a href="https://www.cl.cam.ac.uk/~nk480/">Neel Krishnaswami</a> 教授擔任特別講師，講題為 Programming with Modal Types，內容簡介如下：<br /><br />
  著名的 Curry-Howard 對應闡述形式邏輯和函式程設之間深刻的對應：邏輯命題與型別相對應，命題的證明與該型別的程式亦相對應。然而幾個世紀以來，邏輯學家認識到邏輯系統並非只有一種，而是存在許多不同的邏輯系統。在過去的幾十年中，電腦科學家已經理解到這些邏輯系統可以反過來為程式語言提供新的見解。<br />
    傳統邏輯最重要的擴充之一是模態邏輯（modal logic）。這將形式邏輯拓展到對於相對情境下斷言的研究。例如，我們不可能說「正在下雨」這個命題絕對是真或假，而是得取決於它被斷言的時間和地點。從電腦科學的角度來看，這表明我們可以將型別系統擴展到不單只是資料的形狀，而是關注到程式更深層次的行為特性。<br />
    本課程將探討模態邏輯在程式語言設計中的應用，從它們在型別理論中的表現開始，展示如何用於組織各種計算現象，包括反應式程式設計（reactive programming）、增量計算（incremental computing）、資料庫查詢語言（data query language），甚至是能力安全程式設計（capability-safe programming）。

