courses:
- title: 函數程設
  id: fp
  intro: 本課程以 Haskell 為工具，概述函數程式設計相關的一些必備知識，以便與其他課程銜接。
    由歸納法開始，我們將談資料結構與函數的歸納定義，發現函數的定義可依循資料結構的定義。
    而若欲證明該函數的性質，又可使用歸納法，其證明可依循函數的定義。
    接著我們會談到摺 (fold) 的觀念，發現摺可視為一種歸納法的抽象。
  instructors:
  - name: 穆信成
    personalPage: "https://management.ntu.edu.tw/IM/faculty/teacher/sn/28"
    affi: 中央研究院資訊科學所
  resource:
  - type: 講義
    items:
    - name: Handout
      link: "/2024/FP-Handouts.pdf"
  - type: 原始檔
    items:
    - name: FP-practicals_code.zip
      link: "/2024/FP-practicals_code.zip"
  - type: 習題與解答
    items:
    - name: Practicals 00
      link: "/2024/FP-practicals_00.pdf"
    - name: Practicals 02
      link: "/2024/FP-practicals_02.pdf"
    - name: Solutions 00
      link: "/2024/FP-practicals_00_sols.pdf"
- title: 邏輯
  id: logic
  intro: 數學證明建立於有效的推論結構之上， 而型式邏輯學的目的是以嚴謹符號表達這些推論結構並研究其性質。
    這門課聚焦於命題直構邏輯 (propositional intuitionistic logic) 的自然演繹系統 (natural deduction)，討論型式邏輯學裡基本的語法 (syntactic) 和語意 (semantic) 證明方法，並點出邏輯與計算的密切關係，最終引導至依值型別。
    透過對推論結構的型式化學習，這門課也為其他課程所需的數學證明基礎作好準備。
  instructors:
  - name: 柯向上
    personalPage: "https://josh-hs-ko.github.io/"
    affi: 中央研究院資訊科學所
  resource:
  - type: 投影片
    items:
    - name: Logic 1
      link: "/2024/logic_lecture_1.pdf"
    - name: Logic 2
      link: "/2024/logic_lecture_2.pdf"
    - name: Logic 3
      link: "/2024/logic_lecture_3.pdf"
    - name: Supplemental
      link: "/2024/logic_lecture_3_supplemental.pdf"
  - type: 原始檔
    items:
    - name: "DTP.agda"
      link: "/2024/DTP.agda"
    - name: "NDGP.agda"
      link: "/2024/NDGP.agda"
- title: λ-算則
  id: lambda
  intro: 現今許多語言如 Haskell、Agda 都會以 λ-算則 （λ-calculus，其中 λ 唸作 lam-da /ˈlæmdə/）的變形作為語言的模型，因此在課程中我們將從數學角度探討 λ-calculus 以及程式語言各種基本概念跟性質。例如定義何謂計算以及計算上相等的程式證明相關性質；加入型別討論並證明一個有型別沒有副作用的程式是如何能保證計算時一定會算出結果；除了學理上的興趣外，我們也會討論具體實務上應用於許多語言中解決程式碼重複的語言特性—多型（polymorphism）。
  instructors:
  - name: 陳亮廷
    personalPage: "https://l-tchen.github.io/"
    affi: 中央研究院資訊科學所
  resource:
  - type: 投影片
    items:
