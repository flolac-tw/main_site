location: "臺灣大學管理學院一號館 103 教室"

introduction-text: 本課程將講授程式語言領域之入門理論與知識，希望培養學生以型式邏輯進行清晰思考的能力，了解邏輯與程式語言、型別系統的密切關係，以及型別系統在程式語言中扮演的角色，使學生能以遞迴／迭構方式理解並解決程式設計問題，能運用軟體工具輔助邏輯推理及證明程式正確性，並具備進一步探索程式語言相關領域的知識基礎。

talks:
- title: 驗證真實世界的系統
  subtitle: 案例討論：快閃轉換層的形式化驗證
  id: "talk"
  speaker: 張耘盛
  affi: 中央研究院資訊科學研究所
  slides: "/2020/talk-slides.pdf"
  abstract: "形式化驗證是透過數理邏輯來對程式正確性進行推論的一套方法。由於這套方法通常被認為不易實現且需大量人力，因此也被認為只適用於小型程式或是與生命攸關的系統。然而，隨著理論與工具的發展，許多像是編譯器和作業系統這類我們在日常生活中會接觸的系統，都在最近這十年內成功地被驗證。在這演講的前半段，我會先討論怎麼樣算是一個「正確的程式」，再介紹一些驗證的技術，最後以示範驗證一個小程式作結。演講的後半段，我會分享在中研院進行形式化驗證的經驗：我們驗證了位於許多固態硬碟內部，一個叫作快閃轉換層的核心軟體元件。內容將包括它的形式規格、斷電的行為模型、我們採用的驗證方法以及驗證時遇到的挑戰。"

