- id: dtp
  title: Dependently Typed Programming
  intro: >-
    The expressiveness of dependent types far exceeds that of type systems in mainstream languages,
    so that properties that would otherwise need to be proved additionally can be written directly as dependent types.
    As we provide more information to the type checker through the dependent type,
    the latter can in turn tell us what is known and what is yet to be satisfied,
    and write the correct program interactively.
    Mathematical theorems and proofs, when expressed in the language of the dependent type,
    not only ensure that the inference is correct, but also that it is computationally meaningful.
    Here mathematics, logic and computation become one, forming a solid basis for the design of a new generation of programming languages.
