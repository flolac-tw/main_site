location: ""

introduction: Introduction

introduction-text: >-
  近年來，從事基礎計算科學研究之台灣學者們已在各校各自成立研究團隊並相互合作。對基礎計算科學有興趣之學生須透過一系列課程學習基本知識；然而，國內從事此類研究的學者分散在各校，難以僅靠一己之力開設整套課程。因此，我們邀請有相同興趣的學者一同開課，訓練下一代的研究人才。
  邏輯、語言與計算」暑期研習營希望培養學員獨立進行基礎計算科學研究之能力。從2008年起，本研習營在兩大主題之間輪流替換。今年之主題為邏輯與正規驗證。
  自 2012 年起，本研習營正式成為台灣大學暑修課程，針對大學部學生開課，但亦歡迎研究生選修。台灣大學學生可透過國立台灣大學暑期課程網選課，有學籍之其他學校學生可透過校際選修選課。
  邏輯、語言與計算」暑期研習營從2007年開始至今每年舉辦，今年為第十七屆。

talks:
- title: "Incorrectness Logic and Underapproximation: Foundations of Bug Catching"
  speaker: "Lê Quang Lộc"
  affi: Department of Computer Science</br>University College London
  id: talkL
  abstract: "The talk would cover the discussion of incorrectness separation logic and its applications in industry (e.g., finding bugs in software development at Meta.)"
  slides: "/2023/talkL_slides.pdf"
- title: "Automatically Debugging AutoML Pipelines Using Maro: ML Automatted Remediaiton Oracle"
  speaker: "Julian Dolby"
  affi: Thomas J.Watson Research Center</br>Yorktown Heights</br>NY USA
  id: talkJ
  abstract: "The talk would focus on how to look for ways to improve AutoML search spaces via SMT. It also involves, effectively, using SMT to generate code."

